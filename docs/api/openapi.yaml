openapi: 3.1.0
info:
  title: Auriva Platform API
  version: 0.3.0-draft
  description: |
    Contract-first API for the Auriva storefront and admin panel (DECISIONS D-052).
    Draft for sign-off together with HLD-v2.md. The coding agent implements this spec;
    both frontends generate typed clients from it.

    Conventions (HLD-v2 §4):
    - JSON, camelCase. IDs are UUID strings. Public resources are addressed by slug.
    - Money is integer paise; every money field ends in `Paise`.
    - Timestamps are ISO-8601 UTC.
    - Lists are offset-paginated (`page`, `size`) → `{items, page, size, totalItems, totalPages}`.
    - Errors use the `Error` envelope with a stable `code`.

    Sessions (D-080): opaque server-side sessions in httpOnly cookies, no JWTs, no refresh.
    Customer cookie `__Secure-auriva_session` is scoped to `<domain>`; admin cookie
    `__Host-auriva_admin` is host-only on `api.<domain>`. Auth must pass AUTH-SECURITY-GATE.md (D-081).
    Auth and `/me*` responses carry `Cache-Control: no-store`. **Every state-changing request (POST/PUT/PATCH/DELETE)
    must send `X-Auriva-Client`** and come from an allowlisted Origin, except payment webhooks.
    No rate limiting in v1 (D-061).
servers:
  - url: https://api.{domain}/v1
    variables:
      domain:
        default: example.com
        description: The brand's custom domain (A-1, not yet provided)
  - url: http://localhost:4000/v1
    description: Local development

tags:
  - name: Auth
  - name: Me
  - name: Catalog
  - name: Reviews
  - name: Home
  - name: Journal
  - name: Forms
  - name: Store
  - name: Cart
  - name: Checkout
  - name: Orders
  - name: Payments
  - name: Admin · Auth
  - name: Admin · Catalog
  - name: Admin · Home
  - name: Admin · Journal
  - name: Admin · Orders
  - name: Admin · Coupons
  - name: Admin · Reviews
  - name: Admin · Stories
  - name: Admin · Media
  - name: Admin · Settings
  - name: Admin · Admins
  - name: Admin · Customers
  - name: Admin · Dashboard
  - name: Health

paths:
  # ───────────────────────────── Auth (customer) ─────────────────────────────
  /auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: Create a customer account (email + password) and start a session
      description: An existing email returns 409 EMAIL_TAKEN (D-083, accepted enumeration trade-off).
      description: When `emailVerificationEnabled` is on, a verification email is sent (D-027).
      parameters: [{ $ref: '#/components/parameters/ClientHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Account created; session cookies set
          headers: { Set-Cookie: { $ref: '#/components/headers/SetSessionCookies' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422':
          description: VALIDATION_FAILED or PASSWORD_BREACHED (found in known breach lists)
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Customer login. Always issues a NEW session ID (no fixation)
      description: Unknown email, wrong password and deactivated account all return 401 INVALID_CREDENTIALS with equal timing.
      parameters: [{ $ref: '#/components/parameters/ClientHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Session cookies set
          headers: { Set-Cookie: { $ref: '#/components/headers/SetSessionCookies' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: End this session (row deleted) and clear the cookie
      security: [{ customerSession: [] }]
      parameters: [{ $ref: '#/components/parameters/ClientHeader' }]
      responses:
        '204': { description: Logged out }
  /auth/logout-all:
    post:
      tags: [Auth]
      operationId: logoutAll
      summary: End every session of this user, including this one
      security: [{ customerSession: [] }]
      parameters: [{ $ref: '#/components/parameters/ClientHeader' }]
      responses:
        '204': { description: All sessions revoked }
  /auth/verify-email:
    post:
      tags: [Auth]
      operationId: verifyEmail
      summary: Confirm email ownership with the emailed token
      parameters: [{ $ref: '#/components/parameters/ClientHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TokenRequest' }
      responses:
        '204': { description: Email verified }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/FeatureDisabled' }
  /auth/verify-email/resend:
    post:
      tags: [Auth]
      operationId: resendVerificationEmail
      summary: Resend the verification email (only when the flag is on)
      security: [{ customerSession: [] }]
      parameters: [{ $ref: '#/components/parameters/ClientHeader' }]
      responses:
        '204': { description: Sent (or already verified) }
        '403': { $ref: '#/components/responses/FeatureDisabled' }
  /auth/password/forgot:
    post:
      tags: [Auth]
      operationId: forgotPassword
      summary: Send a password-reset email
      description: Always returns 204, even for unknown emails (no account enumeration). Works regardless of the verification flag.
      parameters: [{ $ref: '#/components/parameters/ClientHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '204': { description: Accepted }
  /auth/password/reset:
    post:
      tags: [Auth]
      operationId: resetPassword
      summary: Set a new password with the emailed token (also marks the email verified)
      parameters: [{ $ref: '#/components/parameters/ClientHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token: { type: string }
                newPassword: { type: string, minLength: 8, maxLength: 128 }
      responses:
        '204': { description: Password changed; all sessions revoked }
        '400': { $ref: '#/components/responses/BadRequest' }
  /auth/confirm-email-change:
    post:
      tags: [Auth]
      operationId: confirmEmailChange
      summary: Confirm a pending email change with the token sent to the new address
      parameters: [{ $ref: '#/components/parameters/ClientHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TokenRequest' }
      responses:
        '204': { description: Email changed and verified }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ───────────────────────────── Health ─────────────────────────────
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Liveness + DB reachability for Render health checks (review C6). Not logged.
      responses:
        '200':
          description: Up
          content:
            application/json:
              schema:
                type: object
                required: [status, db]
                properties:
                  status: { type: string, enum: [ok] }
                  db: { type: string, enum: [ok] }
        '503': { description: DB unreachable }

  # ───────────────────────────── Me ─────────────────────────────
  /me/password:
    post:
      tags: [Me]
      operationId: changeMyPassword
      summary: Change password while logged in; ends all other sessions (review A4)
      security: [{ customerSession: [] }]
      parameters: [{ $ref: '#/components/parameters/ClientHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '204': { description: Changed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /me:
    get:
      tags: [Me]
      operationId: getMe
      summary: Current customer profile (plus last shipping address for checkout pre-fill, D-046)
      security: [{ customerSession: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Me]
      operationId: updateMe
      summary: Update name / phone
      security: [{ customerSession: [] }]
      parameters: [{ $ref: '#/components/parameters/ClientHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                phone: { $ref: '#/components/schemas/Phone' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /me/email:
    post:
      tags: [Me]
      operationId: requestEmailChange
      summary: Start an email change (confirmation sent to the new address)
      security: [{ customerSession: [] }]
      parameters: [{ $ref: '#/components/parameters/ClientHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newEmail, currentPassword]
              properties:
                newEmail: { type: string, format: email }
                currentPassword: { type: string }
      responses:
        '204': { description: Confirmation email sent }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /me/sessions:
    get:
      tags: [Me]
      operationId: listMySessions
      summary: Active sessions (device, approximate location, last used)
      security: [{ customerSession: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SessionInfo' }
  /me/sessions/{sessionId}:
    delete:
      tags: [Me]
      operationId: revokeMySession
      summary: Revoke one of your own sessions (someone else's → 404)
      security: [{ customerSession: [] }]
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/ClientHeader'
      responses:
        '204': { description: Revoked }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/orders:
    get:
      tags: [Me, Orders]
      operationId: listMyOrders
      summary: The customer's orders, newest first (PENDING/FAILED/EXPIRED excluded unless includeUnpaid=true)
      security: [{ customerSession: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: includeUnpaid
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderSummaryPage' }

  # ───────────────────────────── Catalog ─────────────────────────────
  /categories:
    get:
      tags: [Catalog]
      operationId: listCategories
      summary: Active categories by position
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Category' }
  /categories/{categorySlug}:
    get:
      tags: [Catalog]
      operationId: getCategory
      summary: One category with its active products (category page; O4)
      parameters: [{ $ref: '#/components/parameters/CategorySlug' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CategoryDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
  /products:
    get:
      tags: [Catalog]
      operationId: listProducts
      summary: Active products, optionally by category
      parameters:
        - name: category
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductCardPage' }
  /products/{productSlug}:
    get:
      tags: [Catalog]
      operationId: getProduct
      summary: Product detail page, including up to 4 related products (D-039)
      parameters: [{ $ref: '#/components/parameters/ProductSlug' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductDetail' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────────── Reviews ─────────────────────────────
  /products/{productSlug}/reviews:
    get:
      tags: [Reviews]
      operationId: listProductReviews
      summary: Visible reviews, newest first
      parameters:
        - $ref: '#/components/parameters/ProductSlug'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewPage' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Reviews]
      operationId: createReview
      summary: Review a product (requires a DELIVERED order containing it; one per user per product)
      security: [{ customerSession: [] }]
      parameters:
        - $ref: '#/components/parameters/ProductSlug'
        - $ref: '#/components/parameters/ClientHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateReviewRequest' }
      responses:
        '201':
          description: Created (visible immediately, D-028)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Review' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /products/{productSlug}/reviews/eligibility:
    get:
      tags: [Reviews]
      operationId: getReviewEligibility
      summary: Whether the signed-in customer can review this product
      security: [{ customerSession: [] }]
      parameters: [{ $ref: '#/components/parameters/ProductSlug' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [canReview]
                properties:
                  canReview: { type: boolean }
                  reason:
                    type: string
                    enum: [ELIGIBLE, NOT_PURCHASED, NOT_DELIVERED, ALREADY_REVIEWED]
  /reviews/{reviewId}:
    delete:
      tags: [Reviews]
      operationId: deleteMyReview
      summary: Delete own review (can then post again)
      security: [{ customerSession: [] }]
      parameters:
        - $ref: '#/components/parameters/ReviewId'
        - $ref: '#/components/parameters/ClientHeader'
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────────── Home, journal, forms, store ─────────────────────────────
  /home:
    get:
      tags: [Home]
      operationId: getHome
      summary: Everything the homepage needs in one call (SSR-friendly)
      description: Consolidates the earlier per-module endpoints (/home/highlights, /home/most-reordered, /home/rituals, /home/insta).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Home' }
  /blog-categories:
    get:
      tags: [Journal]
      operationId: listBlogCategories
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/BlogCategory' }
  /blogs:
    get:
      tags: [Journal]
      operationId: listBlogs
      summary: Published posts by position
      parameters:
        - name: category
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BlogCardPage' }
  /blogs/{blogSlug}:
    get:
      tags: [Journal]
      operationId: getBlog
      parameters: [{ $ref: '#/components/parameters/BlogSlug' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BlogDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
  /contact:
    post:
      tags: [Forms]
      operationId: submitContact
      summary: Forward a contact message to the owner's inbox; nothing stored (D-033)
      parameters: [{ $ref: '#/components/parameters/ClientHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, subject, message]
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                email: { type: string, format: email }
                subject: { type: string, minLength: 1, maxLength: 200 }
                message: { type: string, minLength: 1, maxLength: 5000 }
      responses:
        '202': { description: Accepted for sending }
        '422': { $ref: '#/components/responses/ValidationError' }
  /ritual-stories:
    post:
      tags: [Forms]
      operationId: submitRitualStory
      summary: Store a "share your ritual" submission for moderation (D-036)
      description: Signed-in users are linked automatically if a session cookie is present.
      parameters: [{ $ref: '#/components/parameters/ClientHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, story]
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                story: { type: string, minLength: 1, maxLength: 2000 }
                sourcePostSlug: { type: string }
      responses:
        '202': { description: Received }
        '422': { $ref: '#/components/responses/ValidationError' }
  /store/public-settings:
    get:
      tags: [Store]
      operationId: getPublicSettings
      summary: Settings the storefront needs to render (shipping line, Instagram, verification UI)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicSettings' }

  # ───────────────────────────── Cart ─────────────────────────────
  /cart:
    get:
      tags: [Cart]
      operationId: getCart
      summary: Cart with lines, computed totals and stock warnings
      security: [{ customerSession: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [Cart]
      operationId: clearCart
      security: [{ customerSession: [] }]
      parameters: [{ $ref: '#/components/parameters/ClientHeader' }]
      responses:
        '200':
          description: Emptied
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
  /cart/items:
    post:
      tags: [Cart]
      operationId: addCartItem
      summary: Add a product (adding an existing product increments its quantity)
      security: [{ customerSession: [] }]
      parameters: [{ $ref: '#/components/parameters/ClientHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productSlug]
              properties:
                productSlug: { type: string }
                quantity: { type: integer, minimum: 1, maximum: 20, default: 1 }
      responses:
        '200':
          description: Updated cart
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/OutOfStock' }
  /cart/items/{cartItemId}:
    patch:
      tags: [Cart]
      operationId: updateCartItem
      summary: Set quantity (0 removes the line)
      security: [{ customerSession: [] }]
      parameters:
        - $ref: '#/components/parameters/CartItemId'
        - $ref: '#/components/parameters/ClientHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                quantity: { type: integer, minimum: 0, maximum: 20 }
      responses:
        '200':
          description: Updated cart
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/OutOfStock' }
    delete:
      tags: [Cart]
      operationId: removeCartItem
      security: [{ customerSession: [] }]
      parameters:
        - $ref: '#/components/parameters/CartItemId'
        - $ref: '#/components/parameters/ClientHeader'
      responses:
        '200':
          description: Updated cart
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
  /cart/coupon:
    put:
      tags: [Cart]
      operationId: applyCoupon
      summary: Apply a coupon (preview; binding validation happens at checkout)
      security: [{ customerSession: [] }]
      parameters: [{ $ref: '#/components/parameters/ClientHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, minLength: 1, maxLength: 40 }
      responses:
        '200':
          description: Cart with discount applied
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '422':
          description: Coupon rejected. Code is one of COUPON_INVALID (unknown, scheduled or disabled; deliberately not distinguished, review A5), COUPON_EXPIRED, COUPON_MIN_ORDER_NOT_MET, COUPON_ALREADY_USED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [Cart]
      operationId: removeCoupon
      security: [{ customerSession: [] }]
      parameters: [{ $ref: '#/components/parameters/ClientHeader' }]
      responses:
        '200':
          description: Cart without coupon
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }

  # ───────────────────────────── Checkout, orders, payments ─────────────────────────────
  /checkout:
    post:
      tags: [Checkout]
      operationId: startCheckout
      summary: Create a PENDING_PAYMENT order, reserve stock, start a payment session
      description: |
        Transaction, then the gateway call outside it (CHECKOUT-AND-ORDERS §4).
        If this user already has a PENDING_PAYMENT order: an unchanged cart returns that order and
        its payment session (200); a changed cart returns 409 CHECKOUT_IN_PROGRESS (use
        POST /checkout/pending/cancel to start again). The discount is capped so total ≥ ₹1.
        Requires a verified email when `emailVerificationEnabled` is on.
      security: [{ customerSession: [] }]
      parameters:
        - $ref: '#/components/parameters/ClientHeader'
        - name: Idempotency-Key
          in: header
          required: true
          description: Client-generated UUID, scoped to the calling user and kept 24 h. Same user + key returns the same order; same key with a different payload → 422 IDEMPOTENCY_KEY_REUSED (review A6).
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shippingAddress]
              properties:
                shippingAddress: { $ref: '#/components/schemas/ShippingAddress' }
      responses:
        '201':
          description: Order created; hand `payment.clientPayload` to the gateway's checkout widget
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckoutResponse' }
        '200':
          description: Existing pending order returned (same cart, or same idempotency key)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckoutResponse' }
        '403':
          description: EMAIL_NOT_VERIFIED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: OUT_OF_STOCK (details list the lines), CART_EMPTY, PRODUCT_UNAVAILABLE, CHECKOUT_IN_PROGRESS
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: Validation error or coupon no longer valid
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /checkout/pending/cancel:
    post:
      tags: [Checkout]
      operationId: cancelPendingCheckout
      summary: Abandon the in-progress checkout so a new one can start (review B4)
      description: Expires the user's PENDING_PAYMENT order, releases its stock and coupon claim, and voids the gateway session where supported. No-op if none.
      security: [{ customerSession: [] }]
      parameters: [{ $ref: '#/components/parameters/ClientHeader' }]
      responses:
        '204': { description: Cancelled (or nothing pending) }
  /orders/{orderId}:
    get:
      tags: [Orders]
      operationId: getMyOrder
      summary: Own order detail (poll after payment until PLACED / PAYMENT_FAILED / EXPIRED)
      description: May pull payment status from the gateway as a fallback when the webhook is late.
      security: [{ customerSession: [] }]
      parameters: [{ $ref: '#/components/parameters/OrderId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '404': { $ref: '#/components/responses/NotFound' }
  /payments/webhooks/{provider}:
    post:
      tags: [Payments]
      operationId: receivePaymentWebhook
      summary: Gateway webhook (signature-verified, idempotent, amount-checked)
      description: |
        Exempt from session, Origin and X-Auriva-Client checks. Body is provider-specific and read raw for signature verification.
        The order is found ONLY via the stored provider_order_id (never an id in the payload); amount and currency are checked (review A2).
        `fake` is not registered in production: /payments/webhooks/fake returns 404 there (review A1).
      parameters:
        - name: provider
          in: path
          required: true
          schema: { $ref: '#/components/schemas/PaymentProvider' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { description: Processed or duplicate (no-op) }
        '400': { description: Signature invalid }
  /payments/fake/{orderId}/complete:
    post:
      tags: [Payments]
      operationId: completeFakePayment
      summary: DEV ONLY — simulate the fake provider's webhook (success or failure)
      description: Not registered in production builds (D-020).
      x-environments: [local]
      security: [{ customerSession: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/ClientHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome]
              properties:
                outcome: { type: string, enum: [SUCCESS, FAILURE] }
      responses:
        '204': { description: Simulated }

