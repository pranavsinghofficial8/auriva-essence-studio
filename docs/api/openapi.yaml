      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/ClientHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdvanceStatusRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminOrder' }
        '409':
          description: INVALID_TRANSITION
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/orders/{id}/cancel:
    post:
      tags: [Admin · Orders]
      operationId: adminCancelOrder
      summary: Cancel from PLACED or PACKED; restores stock; refund is manual in the gateway (D-017)
      security: [{ adminSession: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/ClientHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 3, maxLength: 500 }
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminOrder' }
        '409':
          description: INVALID_TRANSITION
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /admin/orders/{id}/bookkeeping:
    patch:
      tags: [Admin · Orders]
      operationId: adminUpdateOrderBookkeeping
      summary: Refund flag/note and clearing needs-attention
      security: [{ adminSession: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/ClientHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refunded: { type: boolean }
                refundNote: { type: string, maxLength: 1000 }
                needsAttention: { type: boolean }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminOrder' }

  # ───────────────────────────── Admin · Coupons ─────────────────────────────
  /admin/coupons:
    get:
      tags: [Admin · Coupons]
      operationId: adminListCoupons
      security: [{ adminSession: [] }]
      parameters:
        - name: state
          in: query
          schema: { $ref: '#/components/schemas/CouponState' }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminCouponPage' }
    post:
      tags: [Admin · Coupons]
      operationId: adminCreateCoupon
      security: [{ adminSession: [] }]
      parameters: [{ $ref: '#/components/parameters/ClientHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminCouponInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminCoupon' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/coupons/{id}:
    patch:
      tags: [Admin · Coupons]
      operationId: adminUpdateCoupon
      summary: Update (code is immutable once redeemed; disable via active=false)
      security: [{ adminSession: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/ClientHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminCouponPatch' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminCoupon' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ───────────────────────────── Admin · Reviews & stories ─────────────────────────────
  /admin/reviews:
    get:
      tags: [Admin · Reviews]
      operationId: adminListReviews
      security: [{ adminSession: [] }]
      parameters:
        - name: visibility
          in: query
          schema: { $ref: '#/components/schemas/ReviewVisibility' }
        - name: productId
          in: query
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Newest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminReviewPage' }
  /admin/reviews/{id}/visibility:
    patch:
      tags: [Admin · Reviews]
      operationId: adminSetReviewVisibility
      security: [{ adminSession: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/ClientHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [visibility]
              properties:
                visibility: { $ref: '#/components/schemas/ReviewVisibility' }
      responses:
        '200':
          description: Updated (product aggregates recomputed)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminReview' }
  /admin/reviews/{id}:
    delete:
      tags: [Admin · Reviews]
      operationId: adminDeleteReview
      security: [{ adminSession: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/ClientHeader'
      responses:
        '204': { description: Deleted }
  /admin/ritual-stories:
    get:
      tags: [Admin · Stories]
      operationId: adminListRitualStories
      security: [{ adminSession: [] }]
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/RitualStoryStatus' }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Newest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RitualStoryPage' }
  /admin/ritual-stories/{id}:
    patch:
      tags: [Admin · Stories]
      operationId: adminModerateRitualStory
      security: [{ adminSession: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/ClientHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/RitualStoryStatus' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RitualStory' }

  # ───────────────────────────── Admin · Media, settings, admins, audit ─────────────────────────────
  /admin/media:
    post:
      tags: [Admin · Media]
      operationId: adminUploadImage
      summary: Upload an image to Cloudinary (jpeg/png/webp, ≤ 10 MB) and get its URL (D-031, D-068)
      security: [{ adminSession: [] }]
      parameters: [{ $ref: '#/components/parameters/ClientHeader' }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, purpose]
              properties:
                file: { type: string, format: binary }
                purpose: { $ref: '#/components/schemas/ImagePurpose' }
      responses:
        '201':
          description: Uploaded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadedImage' }
        '413': { description: File too large (IMAGE_TOO_LARGE) }
        '415': { description: Unsupported type (IMAGE_TYPE_NOT_ALLOWED) }
  /admin/settings:
    get:
      tags: [Admin · Settings]
      operationId: adminGetSettings
      security: [{ adminSession: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StoreSettings' }
    patch:
      tags: [Admin · Settings]
      operationId: adminUpdateSettings
      x-requires-reauth: true
      security: [{ adminSession: [] }]
      parameters: [{ $ref: '#/components/parameters/ClientHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StoreSettingsPatch' }
      responses:
        '403': { $ref: '#/components/responses/ReauthRequired' }
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StoreSettings' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/admins:
    get:
      tags: [Admin · Admins]
      operationId: adminListAdmins
      security: [{ adminSession: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AdminUser' }
    post:
      tags: [Admin · Admins]
      operationId: adminCreateAdmin
      x-requires-reauth: true
      summary: Create another admin (password ≥ 12 chars); first admin is a manual DB insert (D-049)
      security: [{ adminSession: [] }]
      parameters: [{ $ref: '#/components/parameters/ClientHeader' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                email: { type: string, format: email }
                password: { type: string, minLength: 12, maxLength: 128 }
      responses:
        '403': { $ref: '#/components/responses/ReauthRequired' }
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUser' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/admins/{id}:
    delete:
      tags: [Admin · Admins]
      operationId: adminRemoveAdmin
      x-requires-reauth: true
      summary: Remove admin role (cannot remove yourself or the last admin)
      security: [{ adminSession: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/ClientHeader'
      responses:
        '403': { $ref: '#/components/responses/ReauthRequired' }
        '204': { description: Removed }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/audit:
    get:
      tags: [Admin · Admins]
      operationId: adminListAudit
      security: [{ adminSession: [] }]
      parameters:
        - name: entity
          in: query
          schema: { type: string }
        - name: entityId
          in: query
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Newest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditPage' }

components:
  securitySchemes:
    customerSession:
      type: apiKey
      in: cookie
      name: __Secure-auriva_session
      description: Opaque server-side session ID (32 random bytes; DB stores SHA-256). HttpOnly; Secure; SameSite=Lax; Domain=<domain>. Idle 30 d, absolute 90 d.
    adminSession:
      type: apiKey
      in: cookie
      name: __Host-auriva_admin
      description: Opaque server-side admin session. HttpOnly; Secure; SameSite=Strict; host-only; Path=/. Idle 30 min, absolute 8 h. Sensitive actions (x-requires-reauth) need POST /admin/auth/reauth within the last 10 min.

  headers:
    SetSessionCookies:
      description: Sets `__Secure-auriva_session` (HttpOnly; Secure; SameSite=Lax; Domain=<domain>; Path=/)
      schema: { type: string }
    SetAdminSessionCookies:
      description: Sets `__Host-auriva_admin` (HttpOnly; Secure; SameSite=Strict; host-only; Path=/)
      schema: { type: string }

  parameters:
    ClientHeader:
      name: X-Auriva-Client
      in: header
      required: true
      description: CSRF defence (D-072). Required on every state-changing request.
      schema: { type: string, enum: [storefront, admin] }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Size:
      name: size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    OrderId:
      name: orderId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CartItemId:
      name: cartItemId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ReviewId:
      name: reviewId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProductSlug:
      name: productSlug
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Slug' }
    CategorySlug:
      name: categorySlug
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Slug' }
    BlogSlug:
      name: blogSlug
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Slug' }

  responses:
    BadRequest:
      description: Invalid or expired token / malformed request
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Unauthorized:
      description: Not signed in or bad credentials (UNAUTHENTICATED, INVALID_CREDENTIALS)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: Signed in but not allowed (FORBIDDEN, REVIEW_NOT_ELIGIBLE)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    FeatureDisabled:
      description: FEATURE_DISABLED (email verification flag is off)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    ReauthRequired:
      description: REAUTH_REQUIRED. Call POST /admin/auth/reauth, then retry
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: NOT_FOUND
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Conflict:
      description: Uniqueness or state conflict (EMAIL_TAKEN, SLUG_TAKEN, SLUG_LOCKED, CODE_TAKEN, ALREADY_REVIEWED, LAST_ADMIN, IN_USE)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    OutOfStock:
      description: OUT_OF_STOCK or PRODUCT_UNAVAILABLE
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    ValidationError:
      description: VALIDATION_FAILED; `details` lists each field problem
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  schemas:
    # ── primitives
    Slug:
      type: string
      pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
      maxLength: 120
    Paise:
      type: integer
      minimum: 0
      description: Money in paise (₹1 = 100).
    Phone:
      type: string
      pattern: '^\+91[6-9][0-9]{9}$'
      description: Indian mobile in E.164.
    Timestamp:
      type: string
      format: date-time
    ImageUrl:
      type: string
      format: uri
    Aura:
      type: string
      enum: [softness, grounding, intimacy, balance, stillness, depth, comfort, purity, clarity]
      description: Fixed list in v1 (D-042); labels and glyphs live in the storefront.
    PageMeta:
      type: object
      required: [page, size, totalItems, totalPages]
      properties:
        page: { type: integer }
        size: { type: integer }
        totalItems: { type: integer }
        totalPages: { type: integer }
    IdOrder:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          uniqueItems: true
          items: { type: string, format: uuid }
    Error:
      type: object
      required: [timestamp, status, code, message]
      properties:
        timestamp: { $ref: '#/components/schemas/Timestamp' }
        status: { type: integer }
        code:
          type: string
          description: Stable machine-readable code (see responses and endpoint descriptions).
        message: { type: string, description: Human-readable, safe to show }
        details:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              code: { type: string }
              message: { type: string }

    # ── auth & users
    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        email: { type: string, format: email }
        password: { type: string, minLength: 8, maxLength: 128 }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    TokenRequest:
      type: object
      required: [token]
      properties:
        token: { type: string }
    Me:
      type: object
      required: [id, name, email, emailVerified]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        emailVerified: { type: boolean }
        phone: { $ref: '#/components/schemas/Phone' }
        lastShippingAddress:
          oneOf:
            - $ref: '#/components/schemas/ShippingAddress'
            - type: 'null'
    AdminUser:
      type: object
      required: [id, name, email]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        createdAt: { $ref: '#/components/schemas/Timestamp' }

    # ── catalog
    Category:
      type: object
      required: [slug, name, eyebrow, headline, intro, burnTime, cardImageUrl, bannerImageUrl]
      properties:
        slug: { $ref: '#/components/schemas/Slug' }
        name: { type: string }
        eyebrow: { type: string }
        headline: { type: string }
        intro: { type: string }
        burnTime: { type: string, examples: ['30–35 min ritual'] }
        cardImageUrl: { $ref: '#/components/schemas/ImageUrl' }
        bannerImageUrl: { $ref: '#/components/schemas/ImageUrl' }
    CategoryDetail:
      allOf:
        - $ref: '#/components/schemas/Category'
        - type: object
          required: [products, otherCategories]
          properties:
            products:
              type: array
              items: { $ref: '#/components/schemas/ProductSection' }
            otherCategories:
              type: array
              items: { $ref: '#/components/schemas/Category' }
    ProductCard:
      type: object
      required: [slug, name, categorySlug, aura, tagline, mrpPaise, sellingPricePaise, inStock, imageUrl]
      properties:
        slug: { $ref: '#/components/schemas/Slug' }
        name: { type: string }
        categorySlug: { $ref: '#/components/schemas/Slug' }
        aura: { $ref: '#/components/schemas/Aura' }
        tagline: { type: string }
        mrpPaise: { $ref: '#/components/schemas/Paise' }
        sellingPricePaise: { $ref: '#/components/schemas/Paise' }
        inStock: { type: boolean }
        imageUrl: { $ref: '#/components/schemas/ImageUrl' }
        ratingAvg: { type: number, minimum: 0, maximum: 5 }
        ratingCount: { type: integer, minimum: 0 }
    ProductSection:
      description: A product as rendered on the category page (alternating sections)
      allOf:
        - $ref: '#/components/schemas/ProductCard'
        - type: object
          required: [poem, fragranceNotes]
          properties:
            poem: { type: string }
            fragranceNotes: { type: string }
    ProductDetail:
      allOf:
        - $ref: '#/components/schemas/ProductSection'
        - type: object
          required: [category, auraQuality, bestFor, packContents, burnTime, images, related]
          properties:
            category: { $ref: '#/components/schemas/Category' }
            auraQuality: { type: string, examples: ['Stability'] }
            bestFor: { type: string }
            packContents: { type: string, examples: ['40 sticks and 1 holder'] }
            burnTime: { type: string }
            images:
              type: array
              minItems: 1
              items:
                type: object
                required: [url]
                properties:
                  url: { $ref: '#/components/schemas/ImageUrl' }
                  altText: { type: string }
            related:
              type: array
              maxItems: 4
              items: { $ref: '#/components/schemas/ProductCard' }
    ProductCardPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/ProductCard' }

    # ── reviews
    ReviewVisibility:
      type: string
      enum: [VISIBLE, HIDDEN]
    CreateReviewRequest:
      type: object
      required: [stars]
      properties:
        stars: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string, maxLength: 1000, description: Plain text; never rendered as Markdown/HTML (review A10) }
    Review:
      type: object
      required: [id, stars, authorName, createdAt]
      properties:
        id: { type: string, format: uuid }
        stars: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string }
        authorName: { type: string, description: First name + last initial }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        isMine: { type: boolean }
    ReviewPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Review' }
    AdminReview:
      allOf:
        - $ref: '#/components/schemas/Review'
        - type: object
          required: [visibility, productSlug, productName, userEmail]
          properties:
            visibility: { $ref: '#/components/schemas/ReviewVisibility' }
            productSlug: { $ref: '#/components/schemas/Slug' }
            productName: { type: string }
            userEmail: { type: string, format: email }
            moderatedAt: { $ref: '#/components/schemas/Timestamp' }
    AdminReviewPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/AdminReview' }

    # ── home, journal, store
    Home:
      type: object
      required: [highlights, mostReordered, ritualCards, instaTiles]
      properties:
        highlights:
          type: array
          items: { $ref: '#/components/schemas/Category' }
        mostReordered:
          type: array
          items: { $ref: '#/components/schemas/ProductCard' }
        ritualCards:
          type: array
          description: Designed for exactly 4 (2×2)
          items: { $ref: '#/components/schemas/RitualCard' }
        instaTiles:
          type: array
          items: { $ref: '#/components/schemas/InstaTile' }
    RitualCard:
      type: object
      required: [title, subtitle, body, imageUrl, productSlug, position]
      properties:
        title: { type: string }
        subtitle: { type: string }
        body: { type: string }
        imageUrl: { $ref: '#/components/schemas/ImageUrl' }
        productSlug: { $ref: '#/components/schemas/Slug' }
        position: { type: integer, description: Storefront picks the sigil by position }
    InstaTile:
      type: object
      required: [imageUrl, altText]
      properties:
        imageUrl: { $ref: '#/components/schemas/ImageUrl' }
        altText: { type: string }
        productSlug: { $ref: '#/components/schemas/Slug' }
        instagramUrl: { type: string, format: uri }
    BlogStatus:
      type: string
      enum: [DRAFT, PUBLISHED]
    BlogCategory:
      type: object
      required: [id, name, slug, position]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { $ref: '#/components/schemas/Slug' }
        position: { type: integer }
    BlogCategoryInput:
      type: object
      required: [name, slug]
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        slug: { $ref: '#/components/schemas/Slug' }
        position: { type: integer }
    BlogCategoryPatch:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        slug: { $ref: '#/components/schemas/Slug' }
        position: { type: integer }
    BlogCard:
      type: object
      required: [slug, title, excerpt, category, readTimeMinutes, coverImageUrl]
      properties:
        slug: { $ref: '#/components/schemas/Slug' }
        title: { type: string }
        excerpt: { type: string }
        category: { $ref: '#/components/schemas/BlogCategory' }
        readTimeMinutes: { type: integer, minimum: 1 }
        coverImageUrl: { $ref: '#/components/schemas/ImageUrl' }
        publishedAt: { $ref: '#/components/schemas/Timestamp' }
    BlogDetail:
      allOf:
        - $ref: '#/components/schemas/BlogCard'
        - type: object
          required: [intro, bodyMarkdown, related]
          properties:
            intro: { type: string }
            bodyMarkdown: { type: string, description: Markdown; storefront renders safely (no raw HTML) }
            related:
              type: array
              maxItems: 3
              items: { $ref: '#/components/schemas/BlogCard' }
    BlogCardPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/BlogCard' }
    PublicSettings:
      type: object
      required: [freeShippingThresholdPaise, shippingFeePaise, emailVerificationEnabled]
      properties:
        freeShippingThresholdPaise: { $ref: '#/components/schemas/Paise' }
        shippingFeePaise: { $ref: '#/components/schemas/Paise' }
        emailVerificationEnabled: { type: boolean }
        instagramHandle: { type: string }

    # ── cart & checkout
    Cart:
      type: object
      required: [lines, itemCount, totals]
      properties:
        lines:
          type: array
          items: { $ref: '#/components/schemas/CartLine' }
        itemCount: { type: integer, description: Total quantity (Nav badge) }
        coupon:
          oneOf:
            - $ref: '#/components/schemas/AppliedCoupon'
            - type: 'null'
        totals: { $ref: '#/components/schemas/Totals' }
    CartLine:
      type: object
      required: [id, product, quantity, lineTotalPaise, availability]
      properties:
        id: { type: string, format: uuid }
        product: { $ref: '#/components/schemas/CartProduct' }
        quantity: { type: integer, minimum: 1 }
        lineTotalPaise: { $ref: '#/components/schemas/Paise' }
        availability:
          type: string
          enum: [AVAILABLE, INSUFFICIENT_STOCK, OUT_OF_STOCK, UNAVAILABLE]
          description: Lines that are not AVAILABLE block checkout.
        availableQuantity: { type: integer, minimum: 0 }
        priceChangedFromPaise:
          allOf: [{ $ref: '#/components/schemas/Paise' }]
          description: Present when the price changed since the item was added; the current price is what's charged (review B5)
    CartProduct:
      type: object
      required: [slug, name, aura, packContents, imageUrl, mrpPaise, sellingPricePaise]
      properties:
        slug: { $ref: '#/components/schemas/Slug' }
        name: { type: string }
        aura: { $ref: '#/components/schemas/Aura' }
        packContents: { type: string }
        imageUrl: { $ref: '#/components/schemas/ImageUrl' }
        mrpPaise: { $ref: '#/components/schemas/Paise' }
        sellingPricePaise: { $ref: '#/components/schemas/Paise' }
    AppliedCoupon:
      type: object
      required: [code, valid]
      properties:
        code: { type: string }
        valid: { type: boolean, description: False if it stopped being valid since applied }
        invalidReason: { type: string }
    Totals:
      type: object
      required: [subtotalPaise, discountPaise, shippingFeePaise, totalPaise, freeShippingThresholdPaise]
      properties:
        subtotalPaise: { $ref: '#/components/schemas/Paise' }
        discountPaise: { $ref: '#/components/schemas/Paise' }
        shippingFeePaise: { $ref: '#/components/schemas/Paise' }
        totalPaise: { $ref: '#/components/schemas/Paise' }
        freeShippingThresholdPaise: { $ref: '#/components/schemas/Paise' }
        amountToFreeShippingPaise: { $ref: '#/components/schemas/Paise' }
    ShippingAddress:
      type: object
      required: [name, phone, line1, city, state, pincode]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        phone: { $ref: '#/components/schemas/Phone' }
        line1: { type: string, minLength: 1, maxLength: 200 }
        line2: { type: string, maxLength: 200 }
        city: { type: string, minLength: 1, maxLength: 100 }
        state: { type: string, minLength: 1, maxLength: 100 }
        pincode: { type: string, pattern: '^[1-9][0-9]{5}$' }
    PaymentProvider:
      type: string
      enum: [fake]
      description: Only the fake provider exists until the gateway is chosen (DF-1); real providers are added to this enum. `fake` is local-only and never registered in production (review A1).
    CheckoutResponse:
      type: object
      required: [order, payment]
      properties:
        order: { $ref: '#/components/schemas/Order' }
        payment:
          type: object
          required: [provider, clientPayload]
          properties:
            provider: { $ref: '#/components/schemas/PaymentProvider' }
            clientPayload:
              type: object
              additionalProperties: true
              description: Provider-specific data for its checkout widget (e.g. provider order id, public key).
            expiresAt: { $ref: '#/components/schemas/Timestamp' }

    # ── orders
    OrderStatus:
      type: string
      enum: [PENDING_PAYMENT, PAYMENT_FAILED, EXPIRED, PLACED, PACKED, SHIPPED, DELIVERED, CANCELLED]
    OrderLine:
      type: object
      required: [productSlug, productName, quantity, unitPricePaise, mrpPaise, lineTotalPaise]
      properties:
        productSlug: { $ref: '#/components/schemas/Slug' }
        productName: { type: string }
        imageUrl: { $ref: '#/components/schemas/ImageUrl' }
        quantity: { type: integer, minimum: 1 }
        unitPricePaise: { $ref: '#/components/schemas/Paise' }
        mrpPaise: { $ref: '#/components/schemas/Paise' }
        lineTotalPaise: { $ref: '#/components/schemas/Paise' }
        canReview: { type: boolean, description: True when order is DELIVERED and not yet reviewed }
    StatusEvent:
      type: object
      required: [status, at]
      properties:
        status: { $ref: '#/components/schemas/OrderStatus' }
        at: { $ref: '#/components/schemas/Timestamp' }
        note: { type: string }
    OrderSummary:
      type: object
      required: [id, orderNumber, status, totalPaise, itemCount, createdAt]
      properties:
        id: { type: string, format: uuid }
        orderNumber: { type: string, examples: ['AUR-000123'] }
        status: { $ref: '#/components/schemas/OrderStatus' }
        totalPaise: { $ref: '#/components/schemas/Paise' }
        itemCount: { type: integer }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        placedAt: { $ref: '#/components/schemas/Timestamp' }
    Order:
      allOf:
        - $ref: '#/components/schemas/OrderSummary'
        - type: object
          required: [lines, totals, shippingAddress, timeline]
          properties:
            lines:
              type: array
              items: { $ref: '#/components/schemas/OrderLine' }
            couponCode: { type: string }
            totals:
              type: object
              required: [subtotalPaise, discountPaise, shippingFeePaise, totalPaise]
              properties:
                subtotalPaise: { $ref: '#/components/schemas/Paise' }
                discountPaise: { $ref: '#/components/schemas/Paise' }
                shippingFeePaise: { $ref: '#/components/schemas/Paise' }
                totalPaise: { $ref: '#/components/schemas/Paise' }
            shippingAddress: { $ref: '#/components/schemas/ShippingAddress' }
            reservedUntil: { $ref: '#/components/schemas/Timestamp' }
            courierName: { type: string }
            trackingUrl: { type: string, format: uri }
            trackingNumber: { type: string }
            cancelReason: { type: string }
            timeline:
              type: array
              items: { $ref: '#/components/schemas/StatusEvent' }
    OrderSummaryPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/OrderSummary' }
    AdminOrder:
      allOf:
        - $ref: '#/components/schemas/Order'
        - type: object
          required: [customer, refunded, needsAttention, payments]
          properties:
            customer:
              type: object
              required: [id, name, email]
              properties:
                id: { type: string, format: uuid }
                name: { type: string }
                email: { type: string, format: email }
            refunded: { type: boolean }
            refundNote: { type: string }
            needsAttention: { type: boolean }
            needsAttentionReason: { type: string, examples: ['PAID_AFTER_EXPIRY_NO_STOCK', 'AMOUNT_MISMATCH'] }
            payments:
              type: array
              items:
                type: object
                required: [provider, status, amountPaise, createdAt]
                properties:
                  provider: { $ref: '#/components/schemas/PaymentProvider' }
                  providerPaymentId: { type: string }
                  status: { type: string, enum: [CREATED, SUCCEEDED, FAILED] }
                  amountPaise: { $ref: '#/components/schemas/Paise' }
                  createdAt: { $ref: '#/components/schemas/Timestamp' }
    AdminOrderPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                allOf:
                  - $ref: '#/components/schemas/OrderSummary'
                  - type: object
                    properties:
                      customerName: { type: string }
                      customerEmail: { type: string, format: email }
                      needsAttention: { type: boolean }
    AdvanceStatusRequest:
      type: object
      required: [to]
      properties:
        to: { type: string, enum: [PACKED, SHIPPED, DELIVERED] }
        courierName: { type: string, maxLength: 100, description: Required when to=SHIPPED }
        trackingUrl: { type: string, format: uri, description: Required when to=SHIPPED }
        trackingNumber: { type: string, maxLength: 100 }
        note: { type: string, maxLength: 500 }

    # ── admin catalog
    AdminCategory:
      allOf:
        - $ref: '#/components/schemas/Category'
        - type: object
          required: [id, position, active]
          properties:
            id: { type: string, format: uuid }
            position: { type: integer }
            active: { type: boolean }
    AdminCategoryInput:
      type: object
      required: [slug, name, eyebrow, headline, intro, burnTime, cardImageUrl, bannerImageUrl]
      properties:
        slug: { $ref: '#/components/schemas/Slug' }
        name: { type: string, minLength: 1, maxLength: 60 }
        eyebrow: { type: string, maxLength: 60 }
        headline: { type: string, maxLength: 120 }
        intro: { type: string, maxLength: 600 }
        burnTime: { type: string, maxLength: 40 }
        cardImageUrl: { $ref: '#/components/schemas/ImageUrl' }
        bannerImageUrl: { $ref: '#/components/schemas/ImageUrl' }
        active: { type: boolean, default: true }
    AdminCategoryPatch:
      type: object
      properties:
        slug: { $ref: '#/components/schemas/Slug' }
        name: { type: string, minLength: 1, maxLength: 60 }
        eyebrow: { type: string, maxLength: 60 }
        headline: { type: string, maxLength: 120 }
        intro: { type: string, maxLength: 600 }
        burnTime: { type: string, maxLength: 40 }
        cardImageUrl: { $ref: '#/components/schemas/ImageUrl' }
        bannerImageUrl: { $ref: '#/components/schemas/ImageUrl' }
        active: { type: boolean }
    AdminProductImage:
      type: object
      required: [url, cloudinaryPublicId]
      properties:
        url: { $ref: '#/components/schemas/ImageUrl' }
        cloudinaryPublicId: { type: string }
        altText: { type: string, maxLength: 200 }
    AdminProductFields:
      type: object
      properties:
        slug: { $ref: '#/components/schemas/Slug' }
        name: { type: string, minLength: 1, maxLength: 80 }
        categoryId: { type: string, format: uuid }
        aura: { $ref: '#/components/schemas/Aura' }
        auraQuality: { type: string, maxLength: 60 }
        tagline: { type: string, maxLength: 160 }
        poem: { type: string, maxLength: 300 }
        fragranceNotes: { type: string, maxLength: 200 }
        bestFor: { type: string, maxLength: 160 }
        packContents: { type: string, maxLength: 80 }
        burnTime: { type: string, maxLength: 40 }
        mrpPaise: { $ref: '#/components/schemas/Paise' }
        sellingPricePaise:
          allOf: [{ $ref: '#/components/schemas/Paise' }]
          description: Must be ≤ mrpPaise
        images:
          type: array
          description: Full ordered list; first is the main image
          items: { $ref: '#/components/schemas/AdminProductImage' }
        active: { type: boolean }
    AdminProductInput:
      allOf:
        - $ref: '#/components/schemas/AdminProductFields'
        - type: object
          required: [slug, name, categoryId, aura, auraQuality, tagline, poem, fragranceNotes, bestFor, packContents, burnTime, mrpPaise, sellingPricePaise, initialStock, images]
          properties:
            initialStock: { type: integer, minimum: 0, description: Only at creation; afterwards use stock-adjustments }
    AdminProductPatch:
      $ref: '#/components/schemas/AdminProductFields'
    AdminProduct:
      allOf:
        - $ref: '#/components/schemas/AdminProductFields'
        - type: object
          required: [id, slug, name, categoryId, aura, mrpPaise, sellingPricePaise, stockQuantity, images, active, relatedProductIds, ratingAvg, ratingCount, updatedAt]
          properties:
            id: { type: string, format: uuid }
            stockQuantity: { type: integer, minimum: 0, description: Available to sell now (net of reservations) }
            slugLocked: { type: boolean }
            relatedProductIds:
              type: array
              items: { type: string, format: uuid }
            ratingAvg: { type: number }
            ratingCount: { type: integer }
            updatedAt: { $ref: '#/components/schemas/Timestamp' }
    AdminProductPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/AdminProduct' }

    # ── admin home
    AdminRitualCardFields:
      type: object
      properties:
        title: { type: string, maxLength: 40 }
        subtitle: { type: string, maxLength: 60 }
        body: { type: string, maxLength: 200 }
        imageUrl: { $ref: '#/components/schemas/ImageUrl' }
        productId: { type: string, format: uuid }
        position: { type: integer }
        active: { type: boolean }
    AdminRitualCardInput:
      allOf:
        - $ref: '#/components/schemas/AdminRitualCardFields'
        - type: object
          required: [title, subtitle, body, imageUrl, productId]
    AdminRitualCardPatch:
      $ref: '#/components/schemas/AdminRitualCardFields'
    AdminRitualCard:
      allOf:
        - $ref: '#/components/schemas/AdminRitualCardFields'
        - type: object
          required: [id, title, subtitle, body, imageUrl, productId, position, active]
          properties:
            id: { type: string, format: uuid }
    AdminInstaTileFields:
      type: object
      properties:
        imageUrl: { $ref: '#/components/schemas/ImageUrl' }
        altText: { type: string, maxLength: 200 }
        productId: { type: ['string', 'null'], format: uuid }
        instagramUrl: { type: ['string', 'null'], format: uri }
        position: { type: integer }
        active: { type: boolean }
    AdminInstaTileInput:
      allOf:
        - $ref: '#/components/schemas/AdminInstaTileFields'
        - type: object
          required: [imageUrl, altText]
    AdminInstaTilePatch:
      $ref: '#/components/schemas/AdminInstaTileFields'
    AdminInstaTile:
      allOf:
        - $ref: '#/components/schemas/AdminInstaTileFields'
        - type: object
          required: [id, imageUrl, altText, position, active]
          properties:
            id: { type: string, format: uuid }

    # ── admin journal
    AdminBlogFields:
      type: object
      properties:
        slug: { $ref: '#/components/schemas/Slug' }
        title: { type: string, maxLength: 160 }
        excerpt: { type: string, maxLength: 300 }
        intro: { type: string, maxLength: 500 }
        bodyMarkdown: { type: string, maxLength: 50000 }
        coverImageUrl: { $ref: '#/components/schemas/ImageUrl' }
        categoryId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/BlogStatus' }
    AdminBlogInput:
      allOf:
        - $ref: '#/components/schemas/AdminBlogFields'
        - type: object
          required: [slug, title, excerpt, intro, bodyMarkdown, coverImageUrl, categoryId]
    AdminBlogPatch:
      $ref: '#/components/schemas/AdminBlogFields'
    AdminBlog:
      allOf:
        - $ref: '#/components/schemas/AdminBlogFields'
        - type: object
          required: [id, slug, title, status, position, updatedAt]
          properties:
            id: { type: string, format: uuid }
            position: { type: integer }
            publishedAt: { $ref: '#/components/schemas/Timestamp' }
            updatedAt: { $ref: '#/components/schemas/Timestamp' }
    AdminBlogPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/AdminBlog' }

    # ── coupons
    CouponState:
      type: string
      enum: [SCHEDULED, ACTIVE, EXPIRED, DISABLED]
      description: Derived from active + validFrom/validUntil (D-023)
    AdminCouponFields:
      type: object
      properties:
        code: { type: string, pattern: '^[A-Za-z0-9_-]{6,40}$', description: 'Case-insensitive unique; min 6 chars (review A5). Immutable once redeemed.' }
        type: { type: string, enum: [PERCENT, FLAT] }
        value: { type: integer, minimum: 1, description: 'PERCENT: 1–100; FLAT: paise' }
        maxDiscountPaise: { type: ['integer', 'null'], minimum: 1, description: PERCENT only }
        minOrderValuePaise: { $ref: '#/components/schemas/Paise' }
        perCustomerLimit: { type: string, enum: [ONCE, UNLIMITED] }
        validFrom: { $ref: '#/components/schemas/Timestamp' }
        validUntil: { type: ['string', 'null'], format: date-time }
        active: { type: boolean }
    AdminCouponInput:
      allOf:
        - $ref: '#/components/schemas/AdminCouponFields'
        - type: object
          required: [code, type, value, minOrderValuePaise, perCustomerLimit, validFrom]
    AdminCouponPatch:
      $ref: '#/components/schemas/AdminCouponFields'
    AdminCoupon:
      allOf:
        - $ref: '#/components/schemas/AdminCouponFields'
        - type: object
          required: [id, code, type, value, perCustomerLimit, validFrom, active, state, redemptionCount]
          properties:
            id: { type: string, format: uuid }
            state: { $ref: '#/components/schemas/CouponState' }
            redemptionCount: { type: integer, minimum: 0 }
    AdminCouponPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/AdminCoupon' }

    # ── stories, media, settings, audit
    RitualStoryStatus:
      type: string
      enum: [NEW, APPROVED, REJECTED]
    RitualStory:
      type: object
      required: [id, name, story, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        story: { type: string }
        sourcePostSlug: { type: string }
        userEmail: { type: string, format: email }
        status: { $ref: '#/components/schemas/RitualStoryStatus' }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        moderatedAt: { $ref: '#/components/schemas/Timestamp' }
    RitualStoryPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/RitualStory' }
    ImagePurpose:
      type: string
      enum: [PRODUCT, CATEGORY_CARD, CATEGORY_BANNER, BLOG_COVER, RITUAL_CARD, INSTA_TILE]
      description: Used for folder organisation and to return the recommended crop ratio.
    UploadedImage:
      type: object
      required: [url, cloudinaryPublicId, width, height, recommendedRatio]
      properties:
        url: { $ref: '#/components/schemas/ImageUrl' }
        cloudinaryPublicId: { type: string }
        width: { type: integer }
        height: { type: integer }
        recommendedRatio: { type: string, examples: ['4:5', '3:4', '16:9', '1:1'] }
    StoreSettings:
      type: object
      required: [freeShippingThresholdPaise, shippingFeePaise, reservationMinutes, emailVerificationEnabled, contactInboxEmail]
      properties:
        freeShippingThresholdPaise: { $ref: '#/components/schemas/Paise' }
        shippingFeePaise: { $ref: '#/components/schemas/Paise' }
        reservationMinutes: { type: integer, minimum: 5, maximum: 60 }
        emailVerificationEnabled: { type: boolean }
        contactInboxEmail: { type: string, format: email }
        instagramHandle: { type: string, pattern: '^@?[A-Za-z0-9._]{1,30}$' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
    StoreSettingsPatch:
      type: object
      properties:
        freeShippingThresholdPaise: { $ref: '#/components/schemas/Paise' }
        shippingFeePaise: { $ref: '#/components/schemas/Paise' }
        reservationMinutes: { type: integer, minimum: 5, maximum: 60 }
        emailVerificationEnabled: { type: boolean }
        contactInboxEmail: { type: string, format: email }
        instagramHandle: { type: string, pattern: '^@?[A-Za-z0-9._]{1,30}$' }
    SessionInfo:
      type: object
      required: [id, current, createdAt, lastSeenAt]
      properties:
        id: { type: string, format: uuid }
        current: { type: boolean, description: The session making this request }
        device: { type: string, description: Derived from the user agent, e.g. "Chrome on Android" }
        approximateLocation: { type: string, description: City/country from IP, if available }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        lastSeenAt: { $ref: '#/components/schemas/Timestamp' }
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string }
        newPassword: { type: string, minLength: 8, maxLength: 128, description: Admins need ≥ 12 }
    StockAdjustment:
      type: object
      required: [id, delta, reason, adminEmail, at, stockAfter]
      properties:
        id: { type: string, format: uuid }
        delta: { type: integer }
        reason: { type: string }
        adminEmail: { type: string, format: email }
        stockAfter: { type: integer, minimum: 0 }
        at: { $ref: '#/components/schemas/Timestamp' }
    StockAdjustmentPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/StockAdjustment' }
    AdminDashboard:
      type: object
      required: [today, last7Days, toPack, needsAttention, lowStock, newReviews, newRitualStories]
      properties:
        today: { $ref: '#/components/schemas/SalesSummary' }
        last7Days: { $ref: '#/components/schemas/SalesSummary' }
        toPack: { type: integer, description: Orders in PLACED }
        needsAttention: { type: integer }
        lowStock:
          type: array
          description: Active products at or below 🟡 5 units, lowest first (max 10)
          items:
            type: object
            required: [id, name, stockQuantity]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              stockQuantity: { type: integer }
        newReviews: { type: integer, description: Last 7 days }
        newRitualStories: { type: integer, description: Status NEW }
    SalesSummary:
      type: object
      required: [orders, revenuePaise]
      properties:
        orders: { type: integer, description: Paid orders (PLACED or later, excluding CANCELLED) }
        revenuePaise: { $ref: '#/components/schemas/Paise' }
    AdminCustomer:
      type: object
      required: [id, name, email, emailVerified, active, orderCount, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        emailVerified: { type: boolean }
        active: { type: boolean }
        orderCount: { type: integer }
        lastOrderAt: { $ref: '#/components/schemas/Timestamp' }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
    AdminCustomerPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/AdminCustomer' }
    AuditEntry:
      type: object
      required: [id, adminEmail, action, entity, at]
      properties:
        id: { type: string, format: uuid }
        adminEmail: { type: string, format: email }
        action: { type: string, examples: ['product.update', 'order.cancel', 'settings.update'] }
        entity: { type: string }
        entityId: { type: string }
        diff: { type: object, additionalProperties: true }
        at: { $ref: '#/components/schemas/Timestamp' }
    AuditPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items]
